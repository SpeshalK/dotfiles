# ~/.config/starship.toml

format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$CPP\
$julia\
$docker_context\
$jobs\
$line_break\
$character"""

# FIX: This explicitly tells Starship NOT to add a newline between commands.
add_newline = false

[directory]
#style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
#style = 'fg:green'
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:red'
format = '([$all_status$ahead_behind]($style) )'

# Optional: Add back the clean prompt symbol from our earlier discussion
[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[fill]
symbol = ' '

[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
symbol = ' '

[rust]
style = 'orange'
symbol = ' '

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white='#D8DEE9'
