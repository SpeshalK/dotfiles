# btrbk configuration, installed to /etc/btrbk/btrbk.conf by install.sh
# @VAULT_MOUNT@ is replaced with the machine's vault mount point (e.g. /slopoVault).
# Full reference: man btrbk.conf

transaction_log            /var/log/btrbk.log
lockfile                   /var/lock/btrbk.lock

# Use sudo when btrbk is run by a regular user
backend_local_user         btrfs-progs-sudo

# Buffer between send and receive (needs the mbuffer package)
stream_buffer              256m

# Only snapshot a subvolume if it changed since the last snapshot
snapshot_create            onchange

# Local snapshots: keep everything for 24h, then dailies for 5 days
snapshot_preserve_min      24h
snapshot_preserve          5d

# Vault backups: 14 dailies, 10 weeklies, 36 monthlies
target_preserve_min        no
target_preserve            14d 10w 36m

volume /btrfs_pool
    subvolume home
        snapshot_dir /snapshots/home
        target @VAULT_MOUNT@/snapshots/home

    subvolume root
        snapshot_dir /snapshots/root
        target @VAULT_MOUNT@/snapshots/root
